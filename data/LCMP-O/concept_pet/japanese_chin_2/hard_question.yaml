- id: 1
  type: State Identification
  question: "Look at this photo from our walk today. [IMAGE] Why does he look so unhappy and reluctant to keep moving?"
  image_prompt: "A Japanese Chin standing on a sidewalk during a sudden heavy downpour, looking miserable and soaked."
  evaluation_criteria:
    ideal_answer: "He normally dislikes getting his paws wet or dirty, and this image shows him caught in an unexpected rain shower. His unhappy expression is because the sudden rain forces him to get wet, which conflicts with his long-term preference."
    key_points:
      - "He was recently caught in an unexpected rain shower."
      - "He has a long-term dislike of getting his paws wet or dirty."
  options:
    - "The photo shows reluctance on a rainy walk, but not which personal dislike is driving it."
    - "The temperature dropped suddenly because of the rain, making him feel too cold."
    - "He is anxious because the rain is accompanied by loud thunder, which scares him."
    - "He is unhappy because the sudden rain forces him to get wet, which he hates."
  answer: "He is unhappy because the sudden rain forces him to get wet, which he hates."
